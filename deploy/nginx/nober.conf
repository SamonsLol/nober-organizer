# Plantilla para nginx (servicio del sistema). Reemplazar organizador.midominio.com por tu dominio.
#   sudo cp deploy/nginx/nober.conf /etc/nginx/sites-available/nober
#   sudo ln -s /etc/nginx/sites-available/nober /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name organizador.midominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: quitar esta línea y usar "listen 443 ssl http2;"
    server_name organizador.midominio.com;

    # Certificado: el de origen de Cloudflare (SSL Full / Full strict) o el de Let's Encrypt (certbot)
    ssl_certificate     /etc/ssl/midominio/origin.pem;
    ssl_certificate_key /etc/ssl/midominio/origin.key;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;   # APP_PORT de .env.production
        proxy_http_version 1.1;

        # Next valida que las Server Actions vengan del mismo host: pasar el host original
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}
