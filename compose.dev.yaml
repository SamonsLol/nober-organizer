# Base de datos local para desarrollo: `docker compose -f compose.dev.yaml up -d`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: academic
      POSTGRES_PASSWORD: academic
      POSTGRES_DB: academic_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic -d academic_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
