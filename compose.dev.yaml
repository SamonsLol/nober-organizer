# Base de datos local para desarrollo: `npm run db:up`
name: nober-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nober
      POSTGRES_PASSWORD: nober
      POSTGRES_DB: nober_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nober -d nober_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
