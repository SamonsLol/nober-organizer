<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión · Nober Organizer</title>
<style>
  :root { --bg: #0f0e15; --panel: #1a1924; --text: #f3f1fb; --muted: #a9a5bd; --accent: #8b7cf0; }
  @media (prefers-color-scheme: light) { :root { --bg: #eceaf3; --panel: #ffffff; --text: #1d1b29; --muted: #5d5a70; --accent: #6f5fe0; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 360px; text-align: center; background: var(--panel); border-radius: 24px; padding: 32px 24px; }
  img { width: 56px; height: 56px; border-radius: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 16px 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { border: 0; border-radius: 999px; padding: 10px 20px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>Sin conexión</h1>
  <p>Tus datos viven en el servidor, así que hace falta internet para verlos. Vuelve a intentarlo en cuanto tengas señal.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
